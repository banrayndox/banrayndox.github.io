<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" fill="none">
  <rect width="300" height="360" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="299" height="359" stroke="#e2e8f0"/>
  <!-- Subtle academic grid background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="300" height="360" fill="url(#grid)" />
  
  <!-- Silhouette / Portrait Placeholder -->
  <g transform="translate(150, 160)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="42" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Glasses representation -->
    <circle cx="-16" cy="-45" r="11" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="16" cy="-45" r="11" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M -5 -45 L 5 -45" stroke="#64748b" stroke-width="2.5"/>
    <!-- Shoulders / Torso -->
    <path d="M -75 70 C -75 10 -40 -10 0 -10 C 40 -10 75 10 75 70 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Collar / Shirt -->
    <path d="M -22 10 L 0 35 L 22 10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  
  <!-- Caption box -->
  <rect x="20" y="300" width="260" height="38" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="150" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
    Rakib B
  </text>
  <text x="150" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
    (Replace with photo in /public/rakib.jpg)
  </text>
</svg>
